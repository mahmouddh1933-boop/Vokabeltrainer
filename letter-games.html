  <body>
    <main class="container practice-page letter-bridge-page" id="main-content">
      <header class="page-heading">
        <div>
          <a href="letters.html" data-ar="العودة إلى الحروف وتدريباتها" data-de="Zurück zum Alphabet">العودة إلى الحروف وتدريباتها</a>
          <h1 data-ar="جسر الحروف" data-de="Buchstabenbrücke">جسر الحروف</h1>
          <p data-ar="اختر كلمة وضع حروفها على الجسر من اليمين إلى اليسار. راقب أين تتصل وأين تنفصل." data-de="Wähle ein Wort und setze seine Buchstaben von rechts nach links auf die Brücke. Beobachte, wo sie sich verbinden.">اختر كلمة وضع حروفها على الجسر من اليمين إلى اليسار. راقب أين تتصل وأين تنفصل.</p>
        </div>
      </header>
      <section class="practice-panel letter-bridge" id="letter-bridge">
        <div id="bridge-levels" class="letter-bridge-row" role="group" aria-label="مستوى الكلمات / Schwierigkeitsstufe">
          <button class="practice-button" type="button" data-level="0" data-ar="كلمات قصيرة" data-de="Kurze Wörter">كلمات قصيرة</button>
          <button class="practice-button" type="button" data-level="1" data-ar="أربعة حروف" data-de="Vier Buchstaben">أربعة حروف</button>
          <button class="practice-button" type="button" data-level="2" data-ar="خمسة حروف فأكثر" data-de="Fünf Buchstaben und mehr">خمسة حروف فأكثر</button>
        </div>
        <div class="letter-bridge-picker">
          <label for="bridge-words" data-ar="اختر كلمة" data-de="Wort auswählen">اختر كلمة</label>
          <select id="bridge-words" lang="ar" dir="rtl"></select>
        </div>
        <div class="letter-bridge-deck" lang="ar" dir="rtl">
          <output id="bridge-word" class="letter-bridge-script" aria-live="polite"></output>
        </div>
        <div id="bridge-connections" class="letter-bridge-connections" lang="ar" dir="rtl"></div>
        <div id="bridge-letters" class="letter-bridge-row" lang="ar" dir="rtl" role="group" aria-label="حروف للتركيب / Buchstaben zum Zusammensetzen"></div>
        <p id="bridge-feedback" class="letter-bridge-feedback" role="status"></p>
        <div class="letter-bridge-row">
          <button id="bridge-undo" class="practice-button" type="button" data-ar="تراجع" data-de="Rückgängig">تراجع</button>
          <button id="bridge-reset" class="practice-button" type="button" data-ar="ابدأ من جديد" data-de="Neu beginnen">ابدأ من جديد</button>
          <button id="bridge-next" class="practice-button primary-action" type="button" data-ar="الكلمة التالية" data-de="Nächstes Wort">الكلمة التالية</button>
        </div>
        <p id="practice-audio-status" hidden></p>
      </section>
    </main>
    <footer id="teacher-credit" class="teacher-credit">إعداد الأستاذ محمود بركات</footer>
  </body>

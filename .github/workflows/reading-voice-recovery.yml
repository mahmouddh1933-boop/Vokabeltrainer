name: Generate Arabic reading voice recovery sources
on:
  push:
    branches: [audio/reading-voice-recovery]
    paths:
      - .github/workflows/reading-voice-recovery.yml
      - tools/generate-reading-cloud-cache.py
      - tools/generate-reading-sentence-audio.py
      - data/reading-trainer-sentences.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install audio decoding tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate public word recordings for review
        run: python3 tools/generate-reading-sentence-audio.py
      - name: Save generated sources and generation report on recovery branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/reading-sentences audio/reading-sentences-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Save Arabic speech recovery sources for acoustic review"
            git push origin HEAD:audio/reading-voice-recovery
          fi

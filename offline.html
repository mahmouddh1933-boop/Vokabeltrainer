<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#123f37" />
    <title>دون اتصال · حروف من الزيتون</title>
    <link
      rel="icon"
      href="images/brand/olive-symbol.svg"
      type="image/svg+xml"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f1e5;
        color: #203f35;
        font:
          20px/1.9 Tahoma,
          Arial,
          sans-serif;
      }
      main {
        margin: 20px;
        padding: 30px;
        max-width: 580px;
        background: #fffdf4;
        border: 1px solid #b6cba6;
        border-radius: 22px;
      }
      img {
        width: 80px;
      }
      a,
      button {
        display: inline-block;
        padding: 10px 20px;
        margin: 8px;
        border: 1px solid #718c60;
        border-radius: 12px;
        background: #dce8ce;
        color: #254733;
        font: inherit;
        text-decoration: none;
      }
      p[lang="de"] {
        direction: ltr;
        text-align: left;
        font-size: 17px;
      }
      * { box-sizing: border-box; }
      body { padding: 20px 16px; }
      main { width: min(100%, 580px); margin: 0; padding: clamp(22px, 5vw, 36px); box-shadow: 0 12px 44px #203e370c; }
      img { width: 84px; height: 84px; border-radius: 20px; }
      h1 { font-size: clamp(26px, 6vw, 36px); line-height: 1.6; }
      a { min-height: 48px; max-width: 100%; margin: 8px 0; }
      a:focus-visible { outline: 3px solid #b78c38; outline-offset: 3px; }
      @media(max-width: 400px) { a { display: block; text-align: center; } }
    </style>
  </head>
  <body>
    <main>
      <img src="images/brand/olive-symbol.svg" alt="" />
      <h1>أنت دون اتصال</h1>
      <p>
        هذه الصفحة غير محفوظة على جهازك. يمكنك العودة إلى مسار التعلّم، أو
        المحاولة بعد عودة الإنترنت.
      </p>
      <p lang="de">
        Diese Seite ist offline nicht verfügbar. Öffne deinen gespeicherten
        Lernpfad oder versuche es mit Internet erneut.
      </p>
      <a href="index.html">مسار التعلّم · Lernpfad</a
      ><a href="login.html">تسجيل الدخول · Anmeldung</a>
    </main>
  </body>
</html>

<!doctype html>

<style>
@font-face{font-family:Manrope;src:url('../../fonts/manrope-latin.woff2');font-weight:200 800}

*{box-sizing:border-box}body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f5f1e5;color:#234738;font-family:Manrope,sans-serif}

body.ar{font-family:OliveArabic,serif}.ar .badge{font-size:26px;direction:rtl;padding:6px 27px}.ar .copy{left:auto;right:70px;top:205px;width:550px;direction:rtl;text-align:right}.ar .eyebrow{font-size:26px;letter-spacing:0;margin-bottom:15px}.ar h1{font-family:OliveArabic;font-size:74px;line-height:1.6;letter-spacing:0;margin-bottom:24px}.ar .item{font-size:31px;line-height:1.6;padding:8px 18px;gap:13px}.ar .items{gap:15px}.ar .window{left:70px;top:145px;transform:scale(.95);transform-origin:top left}.ar .bar{font-size:19px;direction:rtl}.ar .hero h1{font-size:77px;line-height:1.6}.ar .hero h2{margin-bottom:4px}.ar .chip{font-size:35px;padding:8px 32px}.ar .hero .chips{direction:rtl}.ar .credit{font-size:29px;direction:rtl;margin-top:19px}.ar.devices .copy{width:550px;top:190px}.ar.devices h1{font-size:62px;line-height:1.6}.ar.devices .window{left:285px;top:225px}.ar.devices .phone{left:75px}.ar .footer{font-size:23px;letter-spacing:0;direction:rtl}.ar .brand strong{font-size:44px}
</style>
<body><div class="paper"></div><div class="branch"></div><header><div class="brand"><img src="../../images/brand/olive-symbol.svg" alt=""><strong>حروف من الزيتون</strong></div><div class="badge">DEMO · ANLEITUNG</div></header>

<script>window.render=async function(s){document.documentElement.lang=s.language||'de';document.body.className=(['intro','outro'].includes(s.id)?'scene-hero':['devices','navigation'].includes(s.id)?'devices':'')+(s.language==='ar'?' ar':'');if(s.language==='ar'){document.querySelector('.badge').textContent='دَلِيلُ اسْتِخْدَامِ النُّسْخَةِ التَّجْرِيبِيَّةِ';document.querySelector('.eyebrow').textContent='اتَّبِعِ الْإِطَارَ الذَّهَبِيَّ';document.querySelector('.brand strong').textContent='حُرُوفٌ مِنَ الزَّيْتُونِ';document.querySelector('.hero h2').textContent='حُرُوفٌ مِنَ الزَّيْتُونِ';document.querySelector('.credit').textContent='إِعْدَادُ الْأُسْتَاذِ مَحْمُودِ بَرَكَات';document.querySelector('.footer').textContent='لَقَطَاتٌ تَوْضِيحِيَّةٌ مِنَ الدِّيمُو';document.querySelector('.bar span:nth-child(2)').textContent=s.stepLabel||'دَلِيلٌ خُطْوَةً خُطْوَةً';}if(s.language!=='ar')document.querySelector('.bar span:nth-child(2)').textContent=s.stepLabel||'Schritt für Schritt';document.getElementById('title').textContent=s.title;document.getElementById('hero-title').textContent=s.title;for(const [id,cls]of [['items','item'],['chips','chip']]){document.getElementById(id).replaceChildren(...s.items.map(t=>{const e=document.createElement('div');e.className=cls;e.textContent=t;return e}))}for(const [id,src]of [['screen',s.image],['mobile',s.mobile]])if(src){const im=document.getElementById(id);im.src=src;await im.decode()}await document.fonts.ready}</script>

<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><style>
@font-face{font-family:Arabic;src:url('/fonts/noto-naskh-arabic.woff')}*{box-sizing:border-box}body{margin:0;background:#fffdf5;color:#244b36;font-family:Arabic;overflow:hidden}header{height:48px;background:#173f34;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:23px}header img{height:36px;width:36px;vertical-align:middle;margin-left:12px}#app{position:absolute;left:0;top:48px;width:1280px;height:588px;border:0;background:#fffdf5}footer{position:absolute;top:636px;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 30px;background:#eef1e1;border-top:2px solid #9aaf83;font-size:26px;line-height:1.45}#title{font-size:21px;color:#e0e9c9}#cursor{position:fixed;z-index:99999;pointer-events:none;left:-50px;top:-50px;width:19px;height:19px;border:3px solid #9c702d;border-radius:50%;background:#dcbf6e55;box-shadow:0 0 0 5px #fffc}#cursor.click{background:#bd8d33;box-shadow:0 0 0 13px #dcbf6e66}
</style><header><span><img src="/images/brand/olive-symbol.svg">حروف من الزيتون — <span id="label"></span></span><span id="title"></span></header><iframe id="app" title="تسجيل مباشر للتطبيق"></iframe><footer id="hint"></footer><i id="cursor"></i><script>window.instruction=(s)=>{document.querySelector('#label').textContent=s.label;document.querySelector('#title').textContent=s.title;document.querySelector('#hint').textContent=s.hint};window.cursor=(p)=>{const n=document.querySelector('#cursor');n.style.left=(p.x-9)+'px';n.style.top=(p.y-9)+'px';n.classList.toggle('click',!!p.click)}</script></html>

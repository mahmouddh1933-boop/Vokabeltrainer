<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=1920,initial-scale=1"><title>Huroof – Ausführliche App-Tour</title><style>
@font-face{font-family:Manrope;src:url('../../fonts/manrope-latin.woff2');font-weight:200 800}@font-face{font-family:Arabic;src:url('../../fonts/noto-naskh-arabic.woff')}*{box-sizing:border-box}body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f7f5eb;color:#214b3c;font-family:Manrope,Arial,sans-serif}.paper{position:absolute;inset:0;background:url('../../images/brand/olive-pattern.svg') repeat;background-size:650px;opacity:.22}.branch{position:absolute;left:-100px;bottom:30px;width:430px;height:700px;background:url('../../images/brand/olive-card-branch.svg') center/contain no-repeat;opacity:.4}header{position:absolute;left:65px;right:65px;top:30px;height:94px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c6d2b9;padding-bottom:20px}.brand{display:flex;align-items:center;gap:16px}.brand img{width:61px;height:61px}.brand strong{font:700 43px Arabic;direction:rtl}.brand span{font-size:20px;letter-spacing:3px;margin-left:14px}.chapter{display:flex;gap:18px;align-items:center;font-size:19px;color:#647b5f}.counter{border:1px solid #b9c9a6;background:#e6edd9;padding:10px 20px;border-radius:26px;font-size:20px;font-weight:700}.copy{position:absolute;left:65px;top:178px;width:400px}.eyebrow{color:#7b854b;font-size:15px;letter-spacing:2.2px;font-weight:800;margin-bottom:22px}h1{font-size:43px;line-height:1.25;margin:0 0 32px;letter-spacing:-1.2px;overflow-wrap:break-word}.bullets{display:grid;gap:16px}.bullet{font-size:22px;line-height:1.5;border:1px solid #c7d2b7;background:#fffdf5df;border-radius:14px;padding:15px 16px;display:flex;gap:13px;align-items:flex-start}.bullet:before{content:'✓';color:#708c45;font-weight:800}.step-label{margin-top:30px;padding:16px 0;border-top:1px solid #c7d4b7;font-size:17px;color:#5e7557;line-height:1.7}.screen{position:absolute;left:516px;top:168px;width:1338px;height:754px;background:#fffef9;border:1px solid #adbf98;border-radius:21px;box-shadow:0 22px 55px #304d2b15;overflow:hidden}.screen-bar{position:absolute;top:0;left:0;right:0;height:30px;background:#e2ead4;display:flex;justify-content:space-between;align-items:center;padding:0 16px;color:#617657;font-size:12px;z-index:2}.dots{letter-spacing:5px;color:#98b080}.screen-content{position:absolute;top:30px;left:0;right:0;bottom:0;overflow:hidden;background:#fffdf5}.screen-content>img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}.subtitle-bg{position:absolute;left:65px;right:65px;bottom:20px;height:116px;background:#1f493b;border:1px solid #44644b;border-radius:15px}.progress{position:absolute;left:0;bottom:0;height:5px;background:#98ad65}.hero{position:absolute;top:155px;left:120px;right:120px;bottom:160px;display:none;text-align:center}.hero>img{width:122px;height:122px}.hero h2{font:700 98px/1.3 Arabic;margin:10px 0 5px;direction:rtl}.hero h3{font-size:49px;line-height:1.35;margin:15px 0}.hero p{font-size:27px;line-height:1.7;color:#5c7456;margin:14px 0}.hero-tags{display:flex;gap:18px;justify-content:center;margin:27px auto}.hero-tags span{padding:12px 26px;border-radius:30px;background:#e4ebd8;border:1px solid #b9cba3;font-size:24px}.hero-mode .hero{display:block}.hero-mode .copy,.hero-mode .screen{display:none}.diagram{height:100%;padding:32px;color:#284b39;display:flex;flex-direction:column;justify-content:center;gap:20px}.diagram h2{font-size:36px;line-height:1.4;margin:0 0 10px}.diagram p{font-size:24px;line-height:1.65;margin:10px 0}.diagram .muted{font-size:19px;color:#657c5d}.diagram .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.diagram .card{padding:24px;background:#eff3e4;border:1px solid #bbcca7;border-radius:15px;font-size:25px;line-height:1.6}.diagram .card b{font-size:27px;display:block;color:#2a5136}.diagram .row{display:flex;gap:20px;align-items:stretch}.diagram .row .card{flex:1;text-align:center}.diagram .big{font-size:46px;display:block;color:#7a8d50}.diagram .line{padding:20px;border-radius:12px;background:#f5efdc;border-left:5px solid #ac8c4e;font-size:23px;line-height:1.6}.diagram .admin-row{display:flex;gap:28px;height:500px}.admin-row img{width:620px;height:500px;object-fit:contain;object-position:top;border:1px solid #c6d4b9;border-radius:12px}.admin-row .legend{flex:1;display:grid;align-content:center;gap:18px}.admin-row .legend .card{font-size:22px;padding:15px}.admin-row .legend .card b{font-size:25px}
</style><body><div class="paper"></div><div class="branch"></div><header><div class="brand"><img src="../../images/brand/olive-symbol.svg" alt=""><strong>حروف من الزيتون</strong><span>HUROOF</span></div><div class="chapter"><span>DIE AUSFÜHRLICHE APP-TOUR</span><span class="counter" id="counter"></span></div></header><aside class="copy"><div class="eyebrow">SCHRITT FÜR SCHRITT LERNEN</div><h1 id="title"></h1><div class="bullets" id="bullets"></div><div class="step-label" id="step-label"></div></aside><main class="screen"><div class="screen-bar"><span class="dots">● ● ●</span><span id="view-label">Ansicht der Anwendung · Beispieldaten</span><span>Huroof</span></div><div class="screen-content" id="screen"></div></main><div class="hero"><img src="../../images/brand/olive-symbol.svg" alt=""><h2>حروف من الزيتون</h2><h3 id="hero-title"></h3><p id="hero-text"></p><div class="hero-tags"><span>Alphabet</span><span>Wortschatz</span><span>Sprachpraxis</span><span>Grammatik</span></div><p>Entwickelt von Lehrer Mahmoud Barakat</p></div><div class="subtitle-bg"></div><div class="progress" id="progress"></div><script>
const $=id=>document.getElementById(id);
const names={};
const diagrams={
 'intro-map':`<h2>Lernbereiche im Überblick</h2><div class="grid"><div class="card">Alphabet und Übungen</div><div class="card">Lesen und Buchstabieren</div><div class="card">Wortschatz</div><div class="card">Fertigkeiten A1–A2</div><div class="card">Sätze bilden</div><div class="card">Kurzgeschichten</div><div class="card">Grammatik und Rechtschreibung</div></div>`,
 'account-diagram':`<h2>Dein Konto in der eingerichteten Online-Ausgabe</h2><div class="row"><div class="card"><span class="big">1</span><b>E-Mail und Passwort</b>Anmelden oder Konto erstellen</div><div class="card"><span class="big">2</span><b>E-Mail bestätigen</b>Link im eigenen Postfach öffnen</div><div class="card"><span class="big">3</span><b>Freigabe prüfen</b>Zugang durch die Lehrkraft</div></div><div class="line">Auch vorhanden: Passwort zurücksetzen · Abmelden · gemerkte Anmeldung auf dem eigenen Gerät</div><p class="muted">Schematische Übersicht. Die Online-Ausgabe muss vom Projektinhaber eingerichtet sein.</p>`,
 'sync-diagram':`<h2>Lernstand passend zur verwendeten Ausgabe</h2><div class="row"><div class="card"><span class="big">☁</span><b>Online-Ausgabe</b>Kontobezogene Synchronisierung über Firebase</div><div class="card"><span class="big">▣</span><b>Ohne Verbindung</b>Antworten bleiben zunächst im eigenen Browser</div><div class="card"><span class="big">▤</span><b>Unabhängige ZIP</b>Lokales Lernen ohne automatische Kontosynchronisierung</div></div><div class="line">Synchronisierung braucht Internet und eine gültige Freigabe. Ein anderer Browser hat nicht automatisch dieselben lokalen Daten.</div><p class="muted">Schematische Übersicht der Speichermöglichkeiten.</p>`,
 'admin-demo':`<h2>Private Verwaltung für die Lehrkraft</h2><div class="admin-row"><img src="../../docs/spark-setup/images/admin-demo.png" alt="Lokale Admin-Beispielansicht"><div class="legend"><div class="card"><b>E-Mails freigeben</b>Lernende gezielt zulassen</div><div class="card"><b>Aktivität überblicken</b>Gemeldete Browser und letzter Kontakt</div><div class="card"><b>E-Mail sperren</b>Zugriff des Kontos auf geschützte Daten entziehen</div><p class="muted">Beispielansicht mit Testdaten; hier in arabischer Oberfläche.</p></div></div>`,
 'admin-limits':`<h2>Die Geräteübersicht richtig verstehen</h2><div class="row"><div class="card"><b>Zwei Browsereinträge</b>Kooperative Grenze in der App-Oberfläche</div><div class="card"><b>Keine sichere Gerätesperre</b>Ein geteilter Kontozugang kann technisch umgangen werden</div></div><div class="line">Eine gesperrte E-Mail verliert gemäß Firestore-Regeln den Zugriff auf geschützte Kontodaten. Offline heruntergeladene Dateien lassen sich nicht sofort zurückholen.</div><p class="muted">Spark ist innerhalb seiner kostenlosen Kontingente nutzbar. Verwaltung und Regeln müssen korrekt eingerichtet sein.</p>`,
 'routine':`<h2>Eine kurze, bewusste Lerneinheit</h2><div class="row"><div class="card"><span class="big">1</span><b>Hören und sehen</b>Wenige neue Buchstaben oder Wörter</div><div class="card"><span class="big">2</span><b>Selbst erinnern</b>Nachsprechen, schreiben und prüfen</div><div class="card"><span class="big">3</span><b>Anwenden</b>Einen Satz oder kurzen Text bilden</div></div><div class="line">Schwierige Wörter notieren und an einem anderen Tag wiederholen.</div>`
};
window.renderTour=(part,chapter,img,total,chapterCount)=>{
 document.body.classList.toggle('hero-mode',['intro','outro'].includes(part.id));
 $('counter').textContent=String(chapter.index+1).padStart(2,'0')+' / '+chapterCount;$('title').textContent=chapter.title;
 $('bullets').replaceChildren(...chapter.bullets.map(t=>{const e=document.createElement('div');e.className='bullet';e.textContent=t;return e}));
 $('step-label').textContent='Kapitel '+(chapter.index+1)+' · Lerne in deinem Tempo. Nutze die Zeitmarken zum Wiederholen.';
 $('hero-title').textContent=part.id==='outro'?'Dein nächster Schritt beginnt hier.':'Arabisch lernen. Mit starken Wurzeln.';
 $('hero-text').textContent=part.id==='outro'?'Öffne deinen Lernpfad und wähle den passenden Einstieg.':'Eine ausführliche Einführung in den Lernweg und die Werkzeuge der Anwendung';
 $('progress').style.width=(part.start/total*100)+'%';
 if(img){$('screen').innerHTML='<img id="screenImage" alt="Praktische Ansicht aus der Anwendung">';$('screenImage').src=img;$('view-label').textContent='Ansicht der Anwendung · Beispieldaten'}
 else{$('screen').innerHTML='<div class="diagram">'+(diagrams[part.id]||'')+'</div>';$('view-label').textContent=part.id==='admin-demo'?'Verwaltungsbeispiel · lokale Testdaten':'Lernübersicht · Erläuterung'}
};
</script></body></html>
